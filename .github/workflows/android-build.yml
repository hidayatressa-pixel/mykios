name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Compile Free Debug
        run: ./gradlew assembleFreeDebug

      - name: Compile Pro Debug
        run: ./gradlew assembleProDebug

      - name: Verify Free Release R8
        run: ./gradlew minifyFreeReleaseWithR8

      - name: Unit tests
        run: ./gradlew testFreeDebugUnitTest testProDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintFreeDebug

      - name: Verify Free Release R8
        run: ./gradlew minifyFreeReleaseWithR8

      - name: Verify Pro Release R8
        run: ./gradlew minifyProReleaseWithR8

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run Free runtime smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedFreeDebugAndroidTest
