name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Compile Free Debug
        run: ./gradlew assembleFreeDebug

      - name: Compile Pro Debug
        run: ./gradlew assembleProDebug

      - name: Verify Free Release R8
        run: ./gradlew minifyFreeReleaseWithR8

      - name: Verify Pro Release R8
        run: ./gradlew minifyProReleaseWithR8
