name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean

      - name: Compile Free Debug
        run: ./gradlew assembleFreeDebug

      - name: Compile Pro Debug
        run: ./gradlew assembleProDebug

      - name: Unit tests
        run: ./gradlew testFreeDebugUnitTest testProDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintFreeDebug || true

      - name: Upload full lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-free-debug
          path: |
            app/build/reports/lint-results-freeDebug.html
            app/build/intermediates/lint_intermediate_text_report/freeDebug/lintReportFreeDebug/lint-results-freeDebug.txt
          if-no-files-found: warn

      - name: Verify Free Release R8
        run: ./gradlew minifyFreeReleaseWithR8

      - name: Verify Pro Release R8
        run: ./gradlew minifyProReleaseWithR8

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run Free runtime smoke tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            adb logcat -c || true
            ./gradlew connectedFreeDebugAndroidTest
            status=$?
            echo "===== MYKIOS CRASH LOG ====="
            adb logcat -d -v threadtime | grep -E -A 80 -B 20 "FATAL EXCEPTION|AndroidRuntime|Process: com\.app\.mykios|com\.app\.mykios.*Exception" || true
            adb logcat -d -v threadtime > runtime-logcat.txt || true
            exit $status

      - name: Upload runtime crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-crash-diagnostics
          path: |
            runtime-logcat.txt
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
